<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="224 224 576 576" role="img" aria-labelledby="title description" data-muzzle-x="512" data-muzzle-y="295" data-direction-x="0" data-direction-y="-1" data-recoil-x="0" data-recoil-y="1" data-pivot-x="512" data-pivot-y="551.7231">
  <title id="title">觅维 MeWiki 文字大炮</title>
  <desc id="description">炮尾上方视角的蓝黑圆润大炮，单个浅灰蓝底座与略微伸出底盘的深色正圆炮耳，炮耳上侧保留圆头弧形高亮。炮嘴为两端圆滑的同向拱形厚沿，背面薄暗壁紧贴厚沿，只在两侧水平线下略微露出，内部不可见。炮嘴、炮管与左肩保留宽圆高亮，炮管与肩部连续连接。炮身直接显示蓝白 M，左侧笔画顺着弧势向下延伸以平衡左右重心，主笔画比例保持，不加圆形底托。各部件独立分层，背景透明。</desc>
