name: Community checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'tojayon/MeWiki'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MEWIKI_RESEARCH_SETTINGS: .mewiki/community-ci/settings.json
      MEWIKI_EXPORT_E2E_SETTINGS: .mewiki/community-ci/settings.json
      MEWIKI_PLUGIN_DIRECTORY: .mewiki/community-ci/plugins
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run public:check
      - name: Check public commit history as well as current files
        run: node scripts/check-public-source.mjs --history "$PUBLIC_BASE_SHA" "$GITHUB_SHA"
        env:
          PUBLIC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
      - run: npm run test:maintenance
      - run: npm run build
      - run: npm run check
      - run: npm run ai:evaluate
      - run: npx playwright install --with-deps msedge
      - name: Check core editing, libraries, handbook and AI context
        run: npx playwright test e2e/mewiki.spec.ts e2e/manual-sidebar.spec.ts e2e/multiple-libraries.spec.ts e2e/ai-product-context-skills.spec.ts --workers=1
