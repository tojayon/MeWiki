<text x="104" y="61" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="700" letter-spacing="-2.8" fill="#112746">MeWiki</text></g>
<text x="94" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="-1.4" fill="#152e50">Knowledge, connected.</text>
<text x="96" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#526987">Notes. Symbols. Sources. One local workspace.</text>
<g transform="translate(96 318)" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5"><circle cx="5" cy="-4" r="4" fill="#2563eb"/><text x="20" fill="#365272">LOCAL FIRST</text><circle cx="179" cy="-4" r="3" fill="#f59e0b"/><text x="194" fill="#365272">OPEN SOURCE</text><circle cx="368" cy="-4" r="3" fill="#dc5b55"/><text x="383" fill="#365272">BUILT FOR IDEAS</text></g>
