<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="440" viewBox="0 0 1600 440" role="img" aria-labelledby="title description">
<title id="title">MeWiki — Knowledge, connected.</title><desc id="description">The blue and white MeWiki monogram connects notes, mathematical symbols, and their sources in a local knowledge workspace.</desc>
<defs><linearGradient id="bg" x1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf3fc"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#b8cce9" opacity=".35"/></pattern><filter id="shadow" x="-30%" y="-40%" width="170%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#123268" flood-opacity=".09"/></filter></defs>
<rect width="1600" height="440" rx="12" fill="url(#bg)"/><rect x="850" width="750" height="440" fill="url(#grid)"/>
<path d="M 920 0 V 440" stroke="#dae5f4" stroke-width="1"/>
